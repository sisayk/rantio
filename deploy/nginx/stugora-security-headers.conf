# Security headers for responses nginx serves itself or gets from Next.js.
# Installed to /etc/nginx/snippets/. Django sets its own (X-Frame-Options, nosniff,
# Referrer-Policy, HSTS) on /api/ and /admin/, so those locations don't include this.
# nginx only inherits add_header from the server block when a location has none of
# its own, so every location that adds a header includes this file instead.
# HSTS: 30 days, the same as Django's SECURE_HSTS_SECONDS.
add_header Strict-Transport-Security "max-age=2592000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
