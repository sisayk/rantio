# Stugora: https://stugora.fi (www.stugora.fi redirects to it).
# Installed to /etc/nginx/sites-available/stugora by deploy/deploy.sh once the
# Let's Encrypt certificate for stugora.fi exists (before that, stugora-http-only.conf).
#
#   /api/, /admin/  -> Django under gunicorn (127.0.0.1:8000)
#   /media/         -> uploads (homepage slides) straight from /srv/stugora/media
#   /static/        -> Django admin CSS/JS from /srv/stugora/static (collectstatic)
#   everything else -> Next.js (127.0.0.1:3000)

# gunicorn's sync workers close each connection, so no keepalive pool for Django.
upstream stugora_django {
    server 127.0.0.1:8000;
}

upstream stugora_next {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Port 80: Let's Encrypt challenges (also for stugora.com), everything else to https://stugora.fi
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stugora.fi www.stugora.fi;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://stugora.fi$request_uri;
    }
}

# https://www.stugora.fi -> https://stugora.fi
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.stugora.fi;

    ssl_certificate /etc/letsencrypt/live/stugora.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stugora.fi/privkey.pem;
    include /etc/nginx/snippets/stugora-ssl.conf;

    return 301 https://stugora.fi$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stugora.fi;

    ssl_certificate /etc/letsencrypt/live/stugora.fi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stugora.fi/privkey.pem;
    include /etc/nginx/snippets/stugora-ssl.conf;

    server_tokens off;

    # Homepage slide uploads: videos up to 40 MB and photos up to 8 MB
    # (backend/owners/media_checks.py), plus room for the rest of the admin form.
    client_max_body_size 64m;
    client_body_timeout 120s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/xml application/rss+xml application/manifest+json
               image/svg+xml font/ttf font/otf;

    access_log /var/log/nginx/stugora.access.log;
    error_log /var/log/nginx/stugora.error.log warn;

    # Django: API and admin. Django adds its own security headers here.
    location /api/ {
        include /etc/nginx/snippets/stugora-proxy.conf;
        proxy_pass http://stugora_django;
    }
    location /admin/ {
        include /etc/nginx/snippets/stugora-proxy.conf;
        proxy_pass http://stugora_django;
    }
    # /admin without the slash: let Django add it.
    location = /admin {
        include /etc/nginx/snippets/stugora-proxy.conf;
        proxy_pass http://stugora_django;
    }

    # Uploads. Only ever served as files; cached 30 days by browsers.
    location /media/ {
        alias /srv/stugora/media/;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/stugora-security-headers.conf;
        access_log off;
    }

    # Django admin's CSS/JS (python manage.py collectstatic).
    location /static/ {
        alias /srv/stugora/static/;
        # Admin files keep their names between releases, so a week rather than forever.
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/stugora-security-headers.conf;
        access_log off;
    }

    # Next.js build assets carry a hash in their names; Next sends
    # "Cache-Control: public, max-age=31536000, immutable" for them itself.
    location /_next/static/ {
        include /etc/nginx/snippets/stugora-proxy.conf;
        proxy_pass http://stugora_next;
        include /etc/nginx/snippets/stugora-security-headers.conf;
        access_log off;
    }

    # Everything else: the Next.js site.
    location / {
        include /etc/nginx/snippets/stugora-proxy.conf;
        # Next.js streams pages (cacheComponents / partial prerendering); don't buffer.
        proxy_buffering off;
        proxy_pass http://stugora_next;
        include /etc/nginx/snippets/stugora-security-headers.conf;
    }
}
