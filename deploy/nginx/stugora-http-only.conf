# Temporary site used until the Let's Encrypt certificate exists (first setup only).
# It answers certbot's challenge and shows the site over plain http so you can check
# it by the server's IP address. deploy/deploy.sh swaps in stugora.conf once
# /etc/letsencrypt/live/stugora.fi/ exists.
upstream stugora_django {
    server 127.0.0.1:8000;
}

upstream stugora_next {
    server 127.0.0.1:3000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name stugora.fi www.stugora.fi stugora.com www.stugora.com _;
    server_tokens off;
    client_max_body_size 64m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location /api/ {
        include /etc/nginx/snippets/stugora-proxy.conf;
        proxy_pass http://stugora_django;
    }
    location /admin/ {
        include /etc/nginx/snippets/stugora-proxy.conf;
        proxy_pass http://stugora_django;
    }
    location /media/ {
        alias /srv/stugora/media/;
    }
    location /static/ {
        alias /srv/stugora/static/;
    }
    location / {
        include /etc/nginx/snippets/stugora-proxy.conf;
        proxy_buffering off;
        proxy_pass http://stugora_next;
    }
}
