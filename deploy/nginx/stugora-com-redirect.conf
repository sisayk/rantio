# stugora.com and www.stugora.com -> https://rantio.fi
# Installed by deploy/deploy.sh only when a certificate named stugora.com exists
# (see DEPLOY.md, step 7). Skip it if you don't own stugora.com.
server {
    listen 80;
    listen [::]:80;
    server_name stugora.com www.stugora.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://rantio.fi$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stugora.com www.stugora.com;

    ssl_certificate /etc/letsencrypt/live/stugora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stugora.com/privkey.pem;
    include /etc/nginx/snippets/stugora-ssl.conf;

    return 301 https://rantio.fi$request_uri;
}
