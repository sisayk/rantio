<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #071423; }
  svg { display: block; width: 2400px; height: 800px; }
</style>
</head>
<body>
<!-- A 6-second loop: every animation's duration divides 6 s, so the last frame meets the first. -->
<svg id="scene" viewBox="0 0 2400 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050d1c"/>
      <stop offset="0.45" stop-color="#0b1f38"/>
      <stop offset="0.75" stop-color="#16395a"/>
      <stop offset="1" stop-color="#21506e"/>
    </linearGradient>
    <linearGradient id="auroraA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf3c4" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#5ef0b0" stop-opacity="0.35"/>
      <stop offset="0.82" stop-color="#47f0a4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b9ffe0" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#9d7bff" stop-opacity="0.45"/>
      <stop offset="0.75" stop-color="#55e6c0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3fe39a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur40" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="blur18" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur11" filterUnits="userSpaceOnUse" x="-400" y="-400" width="2720" height="1600"><feGaussianBlur stdDeviation="11"/></filter>
    <linearGradient id="edgeFade" gradientUnits="userSpaceOnUse" x1="420" y1="0" x2="760" y2="0"><stop offset="0" stop-color="#c6ffe6" stop-opacity="0"/><stop offset="1" stop-color="#c6ffe6" stop-opacity="1"/></linearGradient>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6ef"/>
      <stop offset="0.5" stop-color="#a9c8d8"/>
      <stop offset="1" stop-color="#7fa3b9"/>
    </linearGradient>
    <linearGradient id="snowNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dcecf2"/>
      <stop offset="1" stop-color="#93b4c6"/>
    </linearGradient>
    <linearGradient id="fell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e6a86"/>
      <stop offset="1" stop-color="#284d66"/>
    </linearGradient>
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff9d3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fireGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ff7a2a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a2a22"/>
      <stop offset="1" stop-color="#6a1f19"/>
    </linearGradient>
    <symbol id="spruce" viewBox="0 0 100 240" overflow="visible">
      <path d="M50 0 L64 40 L57 40 L76 86 L66 86 L88 140 L76 140 L100 200 L0 200 L24 140 L12 140 L34 86 L24 86 L43 40 L36 40 Z" fill="#0d2a26"/>
      <path d="M50 0 L60 30 L50 24 L40 30 Z M57 40 L70 72 L58 64 L46 72 L43 40 Z M66 86 L80 118 L64 110 L48 120 L34 86 Z M76 140 L92 180 L70 170 L50 182 L30 170 L24 140 Z" fill="#e6f1f5" opacity="0.92"/>
      <rect x="45" y="200" width="10" height="16" fill="#1e2b2b"/>
    </symbol>
  </defs>

  <!-- Sky -->
  <rect width="2400" height="800" fill="url(#sky)"/>

  <!-- Stars: a few twinkle -->
  <g fill="#ffffff" transform="scale(1.25 0.8)">
    <circle cx="120" cy="80" r="1.6" opacity="0.8"/><circle cx="260" cy="190" r="1.2" opacity="0.6"/>
    <circle cx="400" cy="60" r="1.8" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="150" r="1.1" opacity="0.5"/><circle cx="700" cy="40" r="1.5" opacity="0.8"/>
    <circle cx="820" cy="230" r="1.2" opacity="0.55"><animate attributeName="opacity" values="0.55;1;0.55" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="110" r="1.7" opacity="0.85"/><circle cx="1090" cy="30" r="1.2" opacity="0.6"/>
    <circle cx="1210" cy="170" r="1.4" opacity="0.7"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1340" cy="70" r="1.9" opacity="0.9"/><circle cx="1480" cy="210" r="1.1" opacity="0.5"/>
    <circle cx="1600" cy="50" r="1.5" opacity="0.8"><animate attributeName="opacity" values="0.8;0.35;0.8" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1730" cy="140" r="1.3" opacity="0.65"/><circle cx="1860" cy="90" r="1.7" opacity="0.85"/>
    <circle cx="180" cy="300" r="1" opacity="0.4"/><circle cx="640" cy="320" r="1" opacity="0.4"/>
    <circle cx="1020" cy="290" r="1.1" opacity="0.45"/><circle cx="1560" cy="330" r="1" opacity="0.4"/>
    <circle cx="1800" cy="260" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.95;0.5" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="400" r="0.9" opacity="0.35"/><circle cx="1260" cy="380" r="0.9" opacity="0.35"/>
  </g>

  <!-- Aurora: soft glow layers under sharper curtains; each path morphs and comes back in 6 s -->
  <g style="mix-blend-mode: screen" transform="translate(330 -110) scale(1.05 0.8)">
    <path filter="url(#blur40)" fill="url(#auroraA)" opacity="0.55">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="M180 300 C460 200 700 330 980 250 C1260 170 1500 60 2100 110 L2100 360 C1560 330 1320 450 1020 500 C720 550 460 470 180 540 Z;
                M180 330 C470 240 720 300 1000 220 C1280 140 1520 90 2100 140 L2100 390 C1580 360 1300 420 1000 470 C720 520 470 500 180 560 Z;
                M180 300 C460 200 700 330 980 250 C1260 170 1500 60 2100 110 L2100 360 C1560 330 1320 450 1020 500 C720 550 460 470 180 540 Z"/>
    </path>
    <path filter="url(#blur18)" fill="url(#auroraA)" opacity="0.95">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="M260 420 C420 330 640 290 820 350 C900 330 980 320 1060 300 C1300 240 1520 150 2060 190 L2060 330 C1560 310 1330 400 1080 440 C820 480 620 430 420 470 Z;
                M260 430 C430 350 660 310 840 330 C920 310 1000 300 1080 280 C1320 230 1540 170 2060 220 L2060 360 C1580 340 1320 380 1060 420 C820 460 640 450 420 480 Z;
                M260 420 C420 330 640 290 820 350 C900 330 980 320 1060 300 C1300 240 1520 150 2060 190 L2060 330 C1560 310 1330 400 1080 440 C820 480 620 430 420 470 Z"/>
    </path>
    <path filter="url(#blur18)" fill="url(#auroraB)" opacity="0.7">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="M1000 140 C1180 90 1340 170 1520 120 S1800 50 2060 80 L2060 250 C1820 230 1620 300 1420 280 S1140 250 1000 300 Z;
                M1000 170 C1200 120 1320 150 1540 110 S1780 80 2060 120 L2060 280 C1840 260 1600 290 1400 300 S1160 280 1000 290 Z;
                M1000 140 C1180 90 1340 170 1520 120 S1800 50 2060 80 L2060 250 C1820 230 1620 300 1420 280 S1140 250 1000 300 Z"/>
    </path>
    <!-- the curtain's bright lower edge -->
    <path filter="url(#blur6)" fill="none" stroke="url(#edgeFade)" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <animate attributeName="d" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="M420 468 C620 430 820 480 1080 438 C1330 398 1560 310 2060 330;
                M420 478 C640 450 820 460 1060 418 C1320 378 1580 340 2060 360;
                M420 468 C620 430 820 480 1080 438 C1330 398 1560 310 2060 330"/>
    </path>
    <!-- Fine vertical rays drifting through the curtain -->
    <g filter="url(#blur11)" opacity="0.55">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;-160 0;0 0" dur="6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
        <rect x="520" y="262" width="8" height="200" fill="#b3ffe0" opacity="0.35"/>
        <rect x="584" y="220" width="13" height="237" fill="#b3ffe0" opacity="0.5"/>
        <rect x="648" y="178" width="10" height="274" fill="#b3ffe0" opacity="0.6"/>
        <rect x="712" y="136" width="15" height="311" fill="#b3ffe0" opacity="0.45"/>
        <rect x="776" y="214" width="12" height="228" fill="#b3ffe0" opacity="0.55"/>
        <rect x="840" y="171" width="9" height="265" fill="#b3ffe0" opacity="0.35"/>
        <rect x="904" y="129" width="14" height="302" fill="#b3ffe0" opacity="0.5"/>
        <rect x="968" y="207" width="11" height="219" fill="#b3ffe0" opacity="0.6"/>
        <rect x="1032" y="165" width="8" height="256" fill="#b3ffe0" opacity="0.45"/>
        <rect x="1096" y="123" width="13" height="293" fill="#b3ffe0" opacity="0.55"/>
        <rect x="1160" y="201" width="10" height="210" fill="#b3ffe0" opacity="0.35"/>
        <rect x="1224" y="159" width="15" height="247" fill="#b3ffe0" opacity="0.5"/>
        <rect x="1288" y="117" width="12" height="284" fill="#b3ffe0" opacity="0.6"/>
        <rect x="1352" y="194" width="9" height="201" fill="#b3ffe0" opacity="0.45"/>
        <rect x="1416" y="152" width="14" height="238" fill="#b3ffe0" opacity="0.55"/>
        <rect x="1480" y="110" width="11" height="275" fill="#b3ffe0" opacity="0.35"/>
        <rect x="1544" y="68" width="8" height="312" fill="#b3ffe0" opacity="0.5"/>
        <rect x="1608" y="146" width="13" height="229" fill="#b3ffe0" opacity="0.6"/>
        <rect x="1672" y="104" width="10" height="266" fill="#b3ffe0" opacity="0.45"/>
        <rect x="1736" y="62" width="15" height="303" fill="#b3ffe0" opacity="0.55"/>
        <rect x="1800" y="140" width="12" height="220" fill="#b3ffe0" opacity="0.35"/>
        <rect x="1864" y="97" width="9" height="257" fill="#b3ffe0" opacity="0.5"/>
        <rect x="1928" y="55" width="14" height="294" fill="#b3ffe0" opacity="0.6"/>
        <rect x="1992" y="133" width="11" height="211" fill="#b3ffe0" opacity="0.45"/>
        <rect x="2056" y="91" width="8" height="248" fill="#b3ffe0" opacity="0.55"/>
        <rect x="2120" y="49" width="13" height="285" fill="#b3ffe0" opacity="0.35"/>
        <rect x="2184" y="127" width="10" height="202" fill="#b3ffe0" opacity="0.5"/>
      </g>
    </g>
    <animate attributeName="opacity" values="0.92;1;0.92" dur="3s" repeatCount="indefinite"/>
  </g>

  <rect x="0" y="420" width="2400" height="380" fill="#9dbccd"/>
  <g transform="translate(0 -300) scale(1.25 1)">
  <!-- Distant fells -->
  <path d="M0 640 C220 600 360 560 540 590 C700 615 820 560 1000 540 C1180 520 1300 580 1480 560 C1660 540 1800 590 1920 600 L1920 760 L0 760 Z" fill="url(#fell)" opacity="0.85"/>
  <path d="M0 640 C220 600 360 560 540 590 C700 615 820 560 1000 540 C1180 520 1300 580 1480 560 C1660 540 1800 590 1920 600" fill="none" stroke="#cfe6ef" stroke-width="5" opacity="0.5"/>

  <!-- Far forest line -->
  <g opacity="0.75">
    <use href="#spruce" x="20" y="618" width="34" height="82"/><use href="#spruce" x="60" y="626" width="28" height="68"/>
    <use href="#spruce" x="300" y="612" width="36" height="86"/><use href="#spruce" x="340" y="622" width="30" height="72"/>
    <use href="#spruce" x="760" y="606" width="36" height="88"/><use href="#spruce" x="800" y="616" width="30" height="72"/>
    <use href="#spruce" x="1040" y="598" width="40" height="96"/><use href="#spruce" x="1086" y="610" width="32" height="78"/>
    <use href="#spruce" x="1700" y="610" width="38" height="92"/><use href="#spruce" x="1744" y="620" width="30" height="74"/>
    <use href="#spruce" x="1840" y="606" width="40" height="96"/>
  </g>

  <!-- Snow field with a faint green aurora sheen -->
  <path d="M0 700 C300 670 600 690 900 680 C1200 670 1500 660 1920 690 L1920 1080 L0 1080 Z" fill="url(#snow)"/>
  <ellipse cx="1150" cy="745" rx="700" ry="50" fill="#5ef0b0" opacity="0.08" filter="url(#blur18)">
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  </g>
  <!-- Near snow bank in front -->
  <path transform="translate(0 -410) scale(1.25 1)" d="M0 905 C200 876 420 892 640 884 C860 876 1000 846 1180 834 C1380 822 1560 830 1720 818 C1820 812 1880 826 1920 832 L1920 1080 L0 1080 Z" fill="url(#snowNear)"/>
  <rect x="0" y="660" width="2400" height="140" fill="#93b4c6"/>
  <g transform="translate(875 -279) scale(0.85)">
  <!-- Trees beside the cabin -->
  <use href="#spruce" x="1060" y="470" width="110" height="264"/>
  <use href="#spruce" x="1150" y="520" width="80" height="192"/>
  <use href="#spruce" x="1700" y="440" width="130" height="312"/>
  <use href="#spruce" x="1800" y="500" width="96" height="230"/>

  <!-- Cabin -->
  <g id="cabin">
    <!-- window light spilling on the snow -->
    <ellipse cx="1470" cy="770" rx="230" ry="40" fill="url(#windowGlow)" opacity="0.55">
      <animate attributeName="opacity" values="0.5;0.62;0.5" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- chimney -->
    <rect x="1560" y="520" width="34" height="80" fill="#4b4f55"/>
    <rect x="1554" y="512" width="46" height="14" rx="3" fill="#e9f3f7"/>
    <!-- walls -->
    <rect x="1290" y="600" width="370" height="150" fill="url(#logWall)"/>
    <g stroke="#561812" stroke-width="3" opacity="0.7">
      <line x1="1290" y1="625" x2="1660" y2="625"/><line x1="1290" y1="650" x2="1660" y2="650"/>
      <line x1="1290" y1="675" x2="1660" y2="675"/><line x1="1290" y1="700" x2="1660" y2="700"/>
      <line x1="1290" y1="725" x2="1660" y2="725"/>
    </g>
    <!-- log ends at the corners -->
    <g fill="#c99a6b">
      <circle cx="1286" cy="612" r="7"/><circle cx="1286" cy="637" r="7"/><circle cx="1286" cy="662" r="7"/><circle cx="1286" cy="687" r="7"/><circle cx="1286" cy="712" r="7"/><circle cx="1286" cy="737" r="7"/>
      <circle cx="1664" cy="612" r="7"/><circle cx="1664" cy="637" r="7"/><circle cx="1664" cy="662" r="7"/><circle cx="1664" cy="687" r="7"/><circle cx="1664" cy="712" r="7"/><circle cx="1664" cy="737" r="7"/>
    </g>
    <!-- roof with snow -->
    <path d="M1250 606 L1475 470 L1700 606 Z" fill="#2c2f36"/>
    <path d="M1238 612 L1475 462 L1712 612 L1690 618 C1640 600 1600 612 1560 604 C1520 596 1480 610 1440 602 C1390 592 1350 612 1300 604 C1280 600 1262 612 1238 612 Z" fill="#eef6f9"/>
    <!-- gable window -->
    <rect x="1455" y="535" width="40" height="44" rx="4" fill="#ffd27f"/>
    <path d="M1475 535 V579 M1455 557 H1495" stroke="#7a3b16" stroke-width="3"/>
    <!-- windows -->
    <g>
      <ellipse cx="1365" cy="672" rx="70" ry="56" fill="url(#windowGlow)" opacity="0.55"><animate attributeName="opacity" values="0.5;0.65;0.5" dur="1.5s" repeatCount="indefinite"/></ellipse>
      <rect x="1330" y="645" width="70" height="56" rx="3" fill="#ffd27f"/>
      <path d="M1365 645 V701 M1330 673 H1400" stroke="#7a3b16" stroke-width="4"/>
      <rect x="1326" y="641" width="78" height="64" rx="4" fill="none" stroke="#f1e6d6" stroke-width="5"/>
      <ellipse cx="1590" cy="672" rx="70" ry="56" fill="url(#windowGlow)" opacity="0.55"><animate attributeName="opacity" values="0.6;0.48;0.6" dur="2s" repeatCount="indefinite"/></ellipse>
      <rect x="1555" y="645" width="70" height="56" rx="3" fill="#ffd27f"/>
      <path d="M1590 645 V701 M1555 673 H1625" stroke="#7a3b16" stroke-width="4"/>
      <rect x="1551" y="641" width="78" height="64" rx="4" fill="none" stroke="#f1e6d6" stroke-width="5"/>
    </g>
    <!-- door -->
    <rect x="1450" y="650" width="56" height="100" rx="4" fill="#3b1a12"/>
    <rect x="1446" y="646" width="64" height="104" rx="5" fill="none" stroke="#f1e6d6" stroke-width="5"/>
    <circle cx="1496" cy="702" r="4" fill="#e3b75f"/>
    <!-- step and snow bank -->
    <path d="M1270 750 C1350 738 1420 756 1480 748 C1560 738 1620 756 1690 748 L1700 770 L1260 770 Z" fill="#e6f1f5"/>
  </g>

  <!-- Chimney smoke: puffs rise and fade, staggered so the loop is seamless -->
  <g fill="#c9d6df" filter="url(#blur6)">
    <circle cx="1577" cy="500" r="16" opacity="0">
      <animate attributeName="cy" values="500;360" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1577;1540" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;34" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1577" cy="500" r="16" opacity="0">
      <animate attributeName="cy" values="500;360" dur="3s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1577;1540" dur="3s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;34" dur="3s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="3s" begin="-1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1577" cy="500" r="16" opacity="0">
      <animate attributeName="cy" values="500;360" dur="3s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1577;1540" dur="3s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="14;34" dur="3s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="3s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Fire glow on the snow around the grill -->
  <ellipse cx="1270" cy="900" rx="260" ry="70" fill="url(#fireGlow)">
    <animate attributeName="opacity" values="0.85;1;0.75;1;0.85" dur="1.5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Grill -->
  <g id="grill">
    <path d="M1240 880 L1222 940 M1300 880 L1318 940 M1270 884 L1270 942" stroke="#2a2d33" stroke-width="5" stroke-linecap="round"/>
    <path d="M1212 846 C1212 884 1328 884 1328 846 Z" fill="#2a2d33"/>
    <rect x="1208" y="840" width="124" height="8" rx="3" fill="#3a3e45"/>
    <!-- coals -->
    <ellipse cx="1270" cy="844" rx="52" ry="6" fill="#ff7a2a">
      <animate attributeName="fill" values="#ff7a2a;#ffb347;#ff8a30;#ff7a2a" dur="1.5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- sausages -->
    <g fill="#a8452a">
      <rect x="1236" y="832" width="30" height="9" rx="4.5"/>
      <rect x="1272" y="834" width="30" height="9" rx="4.5"/>
    </g>
    <!-- sparks and grill smoke -->
    <g fill="#ffcf7a">
      <circle cx="1255" cy="830" r="2.4"><animate attributeName="cy" values="830;740" dur="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="1285" cy="830" r="2"><animate attributeName="cy" values="830;730" dur="2s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="cx" values="1285;1296" dur="2s" begin="-0.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="2s" begin="-0.7s" repeatCount="indefinite"/></circle>
      <circle cx="1270" cy="830" r="1.8"><animate attributeName="cy" values="830;750" dur="1.5s" begin="-1s" repeatCount="indefinite"/><animate attributeName="cx" values="1270;1262" dur="1.5s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.5s" begin="-1s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#d7dee4" filter="url(#blur6)">
      <circle cx="1270" cy="820" r="12" opacity="0">
        <animate attributeName="cy" values="820;680" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="cx" values="1270;1300" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="r" values="10;30" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1270" cy="820" r="12" opacity="0">
